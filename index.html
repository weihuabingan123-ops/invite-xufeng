<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>小璐的诚意邀约 🤝</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hearts-bg"></div>

    <div class="container">
        <h1 id="main-title">徐峰先生~8月25日下午15:00,<br>赏光一见好不好?🥺🤝</h1>
        <p class="subtitle" id="subtitle">—— 来自小璐的真诚邀约 ——</p>

        <div class="gif-container">
            <img id="cat-gif" src="https://media.tenor.com/EBV7OT7ACfwAAAAj/u-u-qua-qua-u-quaa.gif" alt="cute character">
        </div>

        <div class="buttons">
            <button id="yes-btn" onclick="handleYesClick()">好,安排!🤝</button>
            <button id="no-btn" onclick="handleNoClick()">没空 🙅</button>
        </div>
        <div id="tease-toast"></div>
    </div>

    <!-- 终极诚意覆盖层 -->
    <div id="force-overlay">
        <div class="force-box">
            <div class="force-title">⚠️ 检测到徐峰先生日理万机</div>
            <div class="force-sub">好话已说尽,正在启动终极诚意程序…</div>
            <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        </div>
    </div>

    <audio id="bg-music" loop autoplay muted>
        <source src="music/bgm.mp3" type="audio/mpeg">
    </audio>

    <button id="music-toggle" onclick="toggleMusic()" title="音乐开关">🔊</button>

    <script src="script.js"></script>
</body>
</html>
